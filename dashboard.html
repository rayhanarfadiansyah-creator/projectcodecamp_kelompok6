<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | GoGreen</title><link rel="stylesheet" href="Home1.css"><style>
body{background:#f3f8f3;color:#173d30}.dash{max-width:1100px;margin:120px auto 60px;padding:24px}.dash-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.dash h1{font:800 clamp(28px,5vw,42px) Manrope;margin:8px 0}.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin:24px 0}.panel,.stat{background:#fff;border:1px solid #e2eee5;border-radius:22px;padding:22px;box-shadow:0 12px 35px #17452a0b}.stat strong{font-size:30px;color:#16875b}.panel h2{margin-top:0}.field{margin:12px 0}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #cbded0;border-radius:12px;font:inherit}.action{border:0;background:#16875b;color:white;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}.muted{color:#718579}.item{padding:12px 0;border-bottom:1px solid #e7eee8}.logout{background:#fff;border:1px solid #cbded0;color:#17452a}.notice{margin:10px 0;color:#16875b}.brand{color:#173d30}@media(max-width:650px){.dash{margin:90px auto 30px;padding:16px}}
</style>  <link rel="stylesheet" href="theme-refresh.css">
</head><body><header class="site-header"><div class="nav-wrap"><nav class="main-nav"><a class="brand" href="Home1.html"><img src="logo.png" alt=""><span>go<span>green</span><i>.</i></span></a><div class="nav-links"><a href="Home1.html">Beranda</a><a href="#lapor">Laporan</a><a href="#setor">Pengumpulan</a><a href="#reward">Reward</a></div><div class="nav-actions"><button class="action logout" id="logout">Keluar</button></div></nav></div></header>
<main class="dash"><div class="dash-head"><div><span class="section-kicker">RUANG AKTIVITASMU</span><h1>Halo, <span id="userName">...</span> 🌱</h1><p class="muted">Terima kasih sudah ikut menjaga bumi.</p></div><div class="stat"><span class="muted">Poin kamu</span><br><strong id="points">0</strong> pts</div></div>
<div class="dash-grid"><section class="panel" id="lapor"><h2>Kirim laporan</h2><form id="reportForm"><div class="field"><input name="title" placeholder="Judul laporan" required minlength="4"></div><div class="field"><textarea name="description" placeholder="Ceritakan masalah lingkungan (min. 10 karakter)" required minlength="10" rows="3"></textarea></div><div class="field"><input name="location" placeholder="Lokasi kejadian (opsional)"></div><button class="action">Kirim laporan</button></form><p class="notice" id="reportNotice"></p><div id="myReports"></div></section>
<section class="panel" id="setor"><h2>Ajukan pengumpulan</h2><form id="collectionForm"><div class="field"><select name="waste_type" required><option value="">Pilih jenis sampah</option><option>Plastik</option><option>Kertas</option><option>Kaca</option><option>Logam</option><option>Organik</option><option>Elektronik</option><option>Lainnya</option></select></div><div class="field"><input name="weight_kg" type="number" min="0.1" max="500" step="0.1" placeholder="Berat (kg)" required></div><div class="field"><textarea name="notes" placeholder="Catatan tambahan (opsional)" rows="2"></textarea></div><button class="action">Ajukan pengumpulan</button></form><p class="notice" id="collectionNotice"></p><div id="myCollections"></div></section></div>
<section class="panel" id="reward"><h2>Reward tersedia</h2><p class="muted">Poin baru diberikan setelah pengumpulan diverifikasi admin.</p><div id="rewards" class="dash-grid"></div><p class="notice" id="rewardNotice"></p></section></main>
<script src="app.js"></script><script>
let csrf='';async function call(url,opts={}){const r=await fetch('api/'+url,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...(opts.headers||{})}});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Gagal');return d}function formData(f){return Object.fromEntries(new FormData(f).entries())}function note(id,msg){document.getElementById(id).textContent=msg}
(async()=>{try{let r=await fetch('api/auth/me.php',{credentials:'same-origin'});let d=await r.json();if(!r.ok)throw Error();csrf=d.csrf;document.getElementById('userName').textContent=d.user.name;document.getElementById('points').textContent=Number(d.user.points).toLocaleString('id-ID');await refresh();}catch(e){location.href='Login.html';}})();
async function refresh(){const [a,b,c]=await Promise.all([call('reports/index.php'),call('collections/index.php'),call('rewards/index.php')]);document.getElementById('myReports').innerHTML='<h3>Riwayat laporan</h3>'+a.reports.map(x=>`<div class="item"><b>${esc(x.title)}</b><br><small>${esc(x.status)} · ${esc(x.created_at)}</small></div>`).join('')||'<p class="muted">Belum ada laporan.</p>';document.getElementById('myCollections').innerHTML='<h3>Riwayat pengumpulan</h3>'+b.collections.map(x=>`<div class="item"><b>${esc(x.waste_type)} · ${x.weight_kg} kg</b><br><small>${esc(x.status)} · ${x.points_awarded} poin</small></div>`).join('');document.getElementById('rewards').innerHTML=c.rewards.map(x=>`<article class="stat"><b>${esc(x.name)}</b><p>${esc(x.description||'')}</p><strong>${Number(x.points_cost).toLocaleString('id-ID')} pts</strong><p><button class="action" onclick="redeem(${x.id})">Tukar poin</button></p></article>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('reportForm').onsubmit=async e=>{e.preventDefault();try{let d=await call('reports/index.php',{method:'POST',body:JSON.stringify(formData(e.target))});note('reportNotice',d.message);e.target.reset();await refresh()}catch(x){note('reportNotice',x.message)}};document.getElementById('collectionForm').onsubmit=async e=>{e.preventDefault();try{let d=await call('collections/index.php',{method:'POST',body:JSON.stringify(formData(e.target))});note('collectionNotice',d.message);e.target.reset();await refresh()}catch(x){note('collectionNotice',x.message)}};async function redeem(id){try{let d=await call('rewards/redeem.php',{method:'POST',body:JSON.stringify({reward_id:id})});note('rewardNotice',d.message);location.reload()}catch(e){note('rewardNotice',e.message)}}document.getElementById('logout').onclick=async()=>{await call('auth/logout.php',{method:'POST',body:'{}'});location.href='Home1.html'};
</script></body></html>
