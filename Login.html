<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login - Go Green
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="Login.css"
  >
</head>

<body>

<main class="login-container">

<section class="login-banner">

<img
  class="banner-image"
  src="login.png"
  alt="Go Green Banner"
>

<div class="banner-overlay"></div>

<img
  class="logo"
  src="logo.png"
  alt="Go Green Logo"
>

<div class="welcome-text">

<h1>
Selamat Datang
</h1>

<p>
Masuk untuk melanjutkan
</p>

</div>

</section>

<section class="login-form-section">

<div class="form-wrapper">

<h2>
Login Account
</h2>

<form>

<div class="input-group">

<label for="email">
Email Address
</label>

<div class="input-box">

<img
  src="user-solid-full.svg"
  alt="User Icon"
>

<input
  type="email"
  id="email"
  placeholder="Masukkan email"
>

</div>

</div>

<div class="input-group">

<label for="password">
Password
</label>

<div class="input-box">

<img
  src="lock-solid-full.svg"
  alt="Lock Icon"
>

<input
  type="password"
  id="password"
  placeholder="Masukkan password"
>

<button
  type="button"
  class="show-password"
>

<img
  src="eye-solid-full.svg"
  alt="Show Password"
>

</button>

</div>

</div>

<button
  class="login-btn"
  type="button"
  onclick="window.location.href='Home2.html'"
>
Masuk
</button>

</form>

<div class="google-login">

<span>
atau lanjut dengan
</span>

<a
  href="http://localhost:8080/login"
  class="google-btn"
>

<img
  src="google.png"
  alt="Google"
>

Continue with Google

</a>

</div>

</div>

</section>

</main>

</body>
</html>
