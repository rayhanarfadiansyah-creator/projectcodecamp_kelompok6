<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | GoGreen</title><link rel="stylesheet" href="Home1.css"><style>body{background:#f3f8f3;color:#173d30}.dash{max-width:1100px;margin:110px auto;padding:24px}.panel,.stat{background:#fff;border:1px solid #e2eee5;border-radius:20px;padding:20px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat strong{font-size:28px;color:#16875b}.action{border:0;border-radius:10px;padding:10px 14px;background:#16875b;color:white;cursor:pointer;margin:4px}.danger{background:#b94b40}.item{padding:14px 0;border-bottom:1px solid #e5eee7}.muted{color:#718579}</style>  <link rel="stylesheet" href="theme-refresh.css">
</head><body><main class="dash"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><div><span class="section-kicker">PANEL PENGELOLA</span><h1>Admin GoGreen</h1></div><button class="action" id="logout">Keluar</button></div><div class="stats" id="stats"></div><section class="panel"><h2>Laporan menunggu</h2><div id="reports"></div></section><section class="panel"><h2>Pengumpulan menunggu</h2><div id="collections"></div></section><p id="notice"></p></main><script>
let csrf='';async function call(url,opts={}){let r=await fetch('api/'+url,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...(opts.headers||{})}}),d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Gagal');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{let r=await fetch('api/auth/me.php',{credentials:'same-origin'}),d=await r.json();if(!r.ok||d.user.role!=='admin')throw Error();csrf=d.csrf;await refresh()}catch(e){location.href='Login.html'}})();async function refresh(){let [a,b]=await Promise.all([call('admin/overview.php'),call('admin/queues.php')]);document.getElementById('stats').innerHTML=Object.entries(a.stats).map(([k,v])=>`<div class="stat"><span>${k.replaceAll('_',' ')}</span><br><strong>${v}</strong></div>`).join('');document.getElementById('reports').innerHTML=b.reports.map(x=>`<div class="item"><b>${esc(x.title)}</b> — ${esc(x.user_name)}<p>${esc(x.description)}</p><small>${esc(x.location||'Lokasi tidak dicantumkan')}</small><br><button class="action" onclick="review('report',${x.id},'in_progress')">Proses</button><button class="action" onclick="review('report',${x.id},'resolved')">Selesaikan</button><button class="action danger" onclick="review('report',${x.id},'rejected')">Tolak</button></div>`).join('')||'<p class="muted">Tidak ada laporan menunggu.</p>';document.getElementById('collections').innerHTML=b.collections.map(x=>`<div class="item"><b>${esc(x.waste_type)} · ${x.weight_kg} kg</b> — ${esc(x.user_name)}<p>${esc(x.notes||'Tanpa catatan')}</p><button class="action" onclick="review('collection',${x.id},'approved')">Setujui & berikan poin</button><button class="action danger" onclick="review('collection',${x.id},'rejected')">Tolak</button></div>`).join('')||'<p class="muted">Tidak ada pengumpulan menunggu.</p>'}async function review(kind,id,status){try{let d=await call('admin/review.php',{method:'POST',body:JSON.stringify({kind,id,status})});document.getElementById('notice').textContent=d.message;await refresh()}catch(e){document.getElementById('notice').textContent=e.message}}document.getElementById('logout').onclick=async()=>{await call('auth/logout.php',{method:'POST',body:'{}'});location.href='Home1.html'};
</script></body></html>
