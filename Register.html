<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar | Go Green</title><link rel="stylesheet" href="Login.css">  <link rel="stylesheet" href="theme-refresh.css">
</head><body class="login-page"><main class="login-shell"><section class="login-visual"><a class="brand brand-light" href="Home1.html"><img src="logo.png" alt=""><span>go<span>green</span><i>.</i></span></a><div class="visual-copy"><span class="eyebrow">SMALL ACTION, BIG IMPACT</span><h1>Mulai aksi baikmu untuk <em>bumi.</em></h1><p>Buat akun GoGreen dan kumpulkan kontribusi positifmu.</p></div></section><section class="login-panel"><div class="panel-top"><a class="back-link" href="Login.html">← Kembali ke login</a></div><div class="form-wrap"><span class="form-kicker">GABUNG BERSAMA KAMI</span><h2>Buat akun<span>.</span></h2><p class="form-subtitle">Isi data berikut untuk memulai.</p><form id="registerForm"><div class="field"><label for="name">Nama lengkap</label><div class="field-control"><input id="name" name="name" required minlength="2" placeholder="Nama kamu"></div></div><div class="field"><label for="email">Email</label><div class="field-control"><input id="email" name="email" type="email" required placeholder="nama@email.com"></div></div><div class="field"><label for="password">Password (min. 8 karakter)</label><div class="field-control"><input id="password" name="password" type="password" required minlength="8" placeholder="Buat password"></div></div><button class="submit-btn" type="submit">Daftar sekarang →</button><p class="form-notice" id="formNotice" role="status" aria-live="polite"></p></form></div></section></main><script>
const f=document.querySelector('#registerForm'),n=document.querySelector('#formNotice');
f.addEventListener('submit',async e=>{e.preventDefault();if(!f.reportValidity())return;n.textContent='Memproses pendaftaran...';try{const c=await fetch('api/auth/csrf.php',{credentials:'same-origin'}).then(r=>r.json());const r=await fetch('api/auth/register.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':c.csrf},body:JSON.stringify({name:f.name.value,email:f.email.value,password:f.password.value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Pendaftaran gagal');n.textContent=d.message;location.href='Home2.html';}catch(x){n.textContent=x.message;}});
</script></body></html>
